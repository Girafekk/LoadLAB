name: CI

on: [push, pull_request]

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: loadlab_ci
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: loadlab_ci
        ports:
          # Фиксированный порт: база живёт только на время job и только на runner.
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U loadlab_ci -d loadlab_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      ENVIRONMENT: test
      POSTGRES_HOST: localhost
      POSTGRES_PORT: 5432
      POSTGRES_DB: loadlab_ci
      POSTGRES_USER: loadlab_ci
      # Пароль одноразовой базы внутри job; секретов проекта здесь нет.
      POSTGRES_PASSWORD: ci-only-password
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - run: python -m pip install -r requirements-dev.txt
      - run: ruff check .
      - run: ruff format --check .
      - run: alembic upgrade head
      - run: alembic check
      - run: pytest

  stand:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: training_stand
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: training_stand/requirements.txt
      - run: python -m pip install -r requirements.txt
      - run: pytest

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install pip-audit
      - run: pip-audit -r backend/requirements.txt -r training_stand/requirements.txt
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npm audit --omit=dev --audit-level=critical
        working-directory: frontend

  production-config:
    runs-on: ubuntu-latest
    env:
      PROD_POSTGRES_PASSWORD: ci-only-password
      PROD_PUBLIC_URL: https://localhost:8443
    steps:
      - uses: actions/checkout@v4
      - run: docker compose -p loadlab-prod -f infrastructure/docker-compose.prod.yml config -q
