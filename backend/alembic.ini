# Настройки Alembic — инструмента миграций базы данных.
# Адрес базы здесь НЕ указывается: он берётся из настроек приложения
# (см. alembic/env.py), чтобы пароль не попадал в файлы проекта.

[alembic]
script_location = %(here)s/alembic
prepend_sys_path = .
# Имена файлов миграций начинаются с даты — их удобно читать по порядку.
file_template = %%(year)d_%%(month).2d_%%(day).2d_%%(hour).2d%%(minute).2d-%%(rev)s_%%(slug)s

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
